<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><meta name="theme-color" content="#000000">
<title>S&amp;H · Agenda</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#d4af37;--g2:#f3d98b;--bd:#2f2711;--mu:#a9a9a9}
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font:15px/1.4 Montserrat,system-ui,sans-serif}
main{max-width:600px;margin:0 auto;padding:12px 14px 90px}
.hd{text-align:center}.logo{width:112px;height:auto;display:block;margin:0 auto}
.tag{text-align:center;color:var(--g);letter-spacing:.32em;font-size:10px;margin:2px 0 10px;font-weight:600}
.tools{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
input,select{width:100%;padding:12px;margin-top:8px;border:1px solid #3d3314;border-radius:10px;background:#000;color:#fff;font:16px Montserrat,system-ui,sans-serif;color-scheme:dark}
.row input{margin:0;flex:1;min-width:0}
button{border:1px solid #3d3314;background:#111;color:var(--g2);border-radius:10px;padding:10px 12px;font:600 13px Montserrat,system-ui,sans-serif;cursor:pointer}
button.pr{background:linear-gradient(135deg,var(--g2),var(--g));color:#000;border:0}
.seg{display:flex;background:#111;border:1px solid var(--bd);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:9px 4px}
.seg button.on{background:linear-gradient(135deg,var(--g2),var(--g));color:#000}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -14px 8px;padding:2px 14px 8px;scrollbar-width:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;border-radius:99px;padding:8px 12px;white-space:nowrap}
.chip i{font-style:normal;background:#000;border-radius:99px;padding:0 7px;font-size:11px;color:var(--g2)}
.chip .d{width:9px;height:9px;border-radius:50%;background:var(--pc)}
.chip.on{background:var(--g);color:#000;border-color:var(--g)}.chip.on i{background:#0003;color:#000}
.stats{display:flex;gap:10px;margin:4px 0 6px}
.stats div{flex:1;background:#111;border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}
.stats b{display:block;font-size:19px;color:var(--g2)}.stats span{font-size:11px;color:var(--mu)}
.dh{margin:14px 0 8px;color:var(--g);font-weight:700;text-transform:capitalize;font-size:14px}
.cols{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -14px;padding:0 14px 10px}
.col{flex:0 0 min(88%,360px);scroll-snap-align:start}.cols.one .col{flex:0 0 100%}
.ch{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--pc);padding:6px 2px 8px;margin-bottom:10px}
.ch b{font-size:16px}.ch span{font-size:12px;color:var(--mu)}
.rest{background:#1a1505;border:1px dashed var(--g);color:var(--g2);border-radius:10px;padding:8px 10px;font-size:12px;margin-bottom:10px}
.c{background:linear-gradient(#131313,#0a0a0a);border:1px solid var(--bd);border-left:4px solid var(--pc);border-radius:12px;padding:12px;margin-bottom:10px}
.c.cancelada{opacity:.45}
.c h3{margin:0;font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center;color:var(--mu)}
.c h3 em{font-style:normal;font-size:19px;color:var(--g2);font-weight:700}
.nm{font-weight:700;margin-top:4px}
.c p{margin:2px 0;color:var(--mu);font-size:13px}
.b{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--g);color:var(--g2);white-space:nowrap}
.b.pendiente{border-style:dashed}.b.atendida{background:var(--g);color:#000}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.fab{position:fixed;right:16px;bottom:18px;width:56px;height:56px;border-radius:50%;font-size:28px;padding:0;box-shadow:0 0 22px #d4af3755}
#tt{display:none;position:fixed;top:10px;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:560px;background:#1a1505;border:1px solid var(--g);color:var(--g2);border-radius:12px;padding:12px 14px;font-weight:600;font-size:13px;z-index:20;text-align:center;box-shadow:0 0 24px #d4af3755}
.msg{color:#ff7b6b;font-weight:600;margin:8px 0}.mu{color:var(--mu)}
#m{display:none;position:fixed;inset:0;background:#000b;align-items:flex-end;justify-content:center;z-index:9}#m.on{display:flex}
.sh{background:#111;border:1px solid var(--bd);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
.sh label{display:block;margin-top:10px;font-size:12px;color:var(--mu);font-weight:600}
@media(min-width:600px){#m{align-items:center}.sh{border-radius:16px}}
</style></head><body><main id="app"></main><div id="m"></div><div id="tt"></div>

const tm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const mn=t=>{const[a,b]=t.split(':');return +a*60+ +b};
const money=n=>'$'+Number(n||0).toLocaleString('es');
const choque=e=>e.status==409||/sin_choques|exclusion|conflicting/i.test(e.detail||'');
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const hrs=b=>b.hora_inicio.slice(0,5)=='00:00'&&b.hora_fin.slice(0,5)=='24:00'?'todo el día':`${b.hora_inicio.slice(0,5)}–${b.hora_fin.slice(0,5)}`;
const dl=d=>new Date(d+'T12:00').toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'});
const today=iso(new Date());
let S=null,svcs=[],pros=[],citas=[],BL=[],date=today,mode='eq',fp='',err='',loading=false;

async function raw(p,o={}){
  const h={apikey:CFG.KEY,'Content-Type':'application/json',...(S?{Authorization:'Bearer '+S.access_token}:{}),...(o.headers||{})};
  const r=await fetch(CFG.URL+p,{...o,headers:h});const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok){const e=new Error('http');e.status=r.status;e.detail=(j&&(j.message||j.msg||j.error_description))||'';throw e}return j}
async function auth(body,grant){S=null;const j=await raw('/auth/v1/token?grant_type='+grant,{method:'POST',body:JSON.stringify(body)});S=j;try{localStorage.setItem('sh-rt',j.refresh_token)}catch(e){}}
async function refresh(){try{const rt=localStorage.getItem('sh-rt');if(!rt)return false;await auth({refresh_token:rt},'refresh_token');return true}catch(e){S=null;return false}}
async function api(p,o){try{return await raw('/rest/v1/'+p,o)}catch(e){if(e.status==401&&await refresh())return raw('/rest/v1/'+p,o);throw e}}

async function login(){const em=$('#em').value.trim(),pw=$('#pw').value;err='';
  try{await auth({email:em,password:pw},'password');await load()}catch(e){S=null;err=e.status==400?'Correo o contraseña incorrectos.':'No se pudo iniciar sesión.';render()}}
async function loadBl(){try{BL=await api(`bloqueos?select=*&or=(fecha.is.null,fecha.gte.${today},fecha_fin.gte.${today})&order=fecha.nullsfirst,dia_semana`)}catch(e){BL=[]}}
async function loadCitas(){const to=mode=='sem'?add(date,6):date;
  citas=await api(`citas?select=id,fecha,hora,dur_min,cliente,telefono,estado,notas,token,profesional_id,servicio_id&fecha=gte.${date}&fecha=lte.${to}&order=fecha,hora`)}
async function load(){loading=true;render();
  try{[svcs,pros]=await Promise.all([api('servicios?select=id,nombre,dur_min,precio&order=nombre'),api('profesionales?select=id,nombre,color&order=nombre')]);await Promise.all([loadCitas(),loadBl()]);err=''}
  catch(e){err='No se pudieron cargar los datos.'}loading=false;render();watch(true)}
async function reload(q){if(!q){loading=true;render()}try{await loadCitas();err=''}catch(e){err='No se pudieron cargar las citas.'}loading=false;render()}
async function upd(id,body){try{await api('citas?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});err=''}catch(e){err=choque(e)?'Ese horario ya está ocupado.':'No se pudo guardar el cambio.'}await reload(1);await watch(true)}

function wa(id){const c=citas.find(x=>x.id==id),s=svcs.find(x=>x.id==c.servicio_id),p=pros.find(x=>x.id==c.profesional_id);
  let ph=c.telefono.replace(/\D/g,'');if(ph.length==10&&ph[0]=='3')ph='57'+ph;
  const t=`Hola ${c.cliente}, te recordamos tu cita en ${CFG.NOMBRE}: ${s?.nombre||'servicio'} con ${p?.nombre||'nuestro equipo'}, ${dl(c.fecha)} a las ${c.hora.slice(0,5)}. Puedes confirmar, reagendar o cancelar aquí: ${CFG.RESERVA}?t=${c.token}`;
  window.open(`https://wa.me/${ph}?text=${encodeURIComponent(t)}`,'_blank')}

function closeM(){$('#m').classList.remove('on');render()}
function form(c){const nw=!c.id;
  $('#m').innerHTML=`<div class="sh"><h3 style="margin:0;color:var(--g2)">${nw?'Nueva cita':'Mover cita'}</h3>${nw?`<label>Cliente<input id="f_cliente"></label><label>Celular<input id="f_telefono" type="tel" placeholder="3001234567"></label><label>Servicio<select id="f_servicio_id">${svcs.map(s=>`<option value="${s.id}">${esc(s.nombre)} · ${s.dur_min} min</option>`).join('')}</select></label>`:`<p class="mu">${esc(c.cliente)}</p>`}<label>Profesional<select id="f_profesional_id">${pros.map(p=>`<option value="${p.id}"${p.id==c.profesional_id?' selected':''}>${esc(p.nombre)}</option>`).join('')}</select></label><label>Fecha<input id="f_fecha" type="date" value="${c.fecha}"></label><label>Hora<input id="f_hora" type="time" step="900" value="${c.hora.slice(0,5)}"></label><div class="msg" id="fe"></div><div class="acts"><button data-a="close">Cancelar</button><button class="pr" data-a="save" data-id="${c.id||''}">Guardar</button></div></div>`;
  $('#m').classList.add('on')}
async function save(){const id=$('[data-a=save]').dataset.id,v=k=>$('#f_'+k)?.value.trim();
  const o={profesional_id:v('profesional_id'),fecha:v('fecha'),hora:v('hora')};
  if(!o.fecha||!o.hora){$('#fe').textContent='Completa fecha y hora.';return}
  try{
    if(id)await api('citas?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({...o,recordatorio_enviado_at:null})});
    else{const nm=v('cliente');let ph=(v('telefono')||'').replace(/\D/g,'');if(ph.length==10&&ph[0]=='3')ph='57'+ph;
      if(nm.length<2||ph.length<8){$('#fe').textContent='Escribe nombre y celular.';return}
      await api('citas',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({...o,servicio_id:v('servicio_id'),cliente:nm,telefono:ph,estado:'confirmada'})})}
    $('#m').classList.remove('on');await reload(1);await watch(true)
  }catch(e){$('#fe').textContent=choque(e)?'Ese horario ya está ocupado.':(e.detail||'No se pudo guardar.')}}

async function showBl(){
  await loadBl();
  const who=b=>b.profesional_id?(pros.find(p=>p.id==b.profesional_id)?.nombre||'?'):'Todo el equipo';
  const when=b=>b.dia_semana!=null?'Cada '+DIAS[b.dia_semana]:(b.fecha_fin&&b.fecha_fin!=b.fecha?`${b.fecha} → ${b.fecha_fin}`:b.fecha);
  $('#m').innerHTML=`<div class="sh"><h3 style="margin:0;color:var(--g2)">Descansos y ausencias</h3>
  ${BL.length?BL.map(b=>`<div class="c" style="--pc:#d4af37;margin-top:10px"><h3><span>${esc(who(b))}</span><button data-a="dbl" data-id="${b.id}">Quitar</button></h3><p>${esc(when(b))} · ${hrs(b)}${b.motivo?' · '+esc(b.motivo):''}</p></div>`).join(''):'<p class="mu">No hay descansos cargados.</p>'}
  <h3 style="color:var(--g2);margin:18px 0 0">Nuevo descanso</h3>
  <label>Quién<select id="b_pro"><option value="">Todo el equipo</option>${pros.map(p=>`<option value="${p.id}">${esc(p.nombre)}</option>`).join('')}</select></label>
  <label>Cuándo<select id="b_tipo"><option value="f">Un día o varios días (vacaciones, permiso)</option><option value="s">Todas las semanas (almuerzo, día libre)</option></select></label>
  <div id="g_f"><label>Desde el día<input id="b_fecha" type="date" value="${date}"></label><label>Hasta el día (opcional)<input id="b_fin" type="date"></label></div>
  <div id="g_s" style="display:none"><label>Día de la semana<select id="b_dia">${DIAS.map((d,i)=>`<option value="${i}">${d}</option>`).join('')}</select></label></div>
  <label>Horario<select id="b_todo"><option value="1">Todo el día</option><option value="0">Solo un rango de horas</option></select></label>
  <div id="g_h" style="display:none"><label>Desde<input id="b_hi" type="time" value="13:00"></label><label>Hasta<input id="b_hf" type="time" value="14:00"></label></div>
  <label>Motivo (opcional)<input id="b_mot" placeholder="Almuerzo, cita médica…"></label>
  <div class="msg" id="fe"></div><div class="acts"><button data-a="close">Cerrar</button><button class="pr" data-a="sbl">Agregar</button></div></div>`;
  $('#m').classList.add('on')}
async function saveBl(){const v=k=>$('#b_'+k).value,s=v('tipo')=='s',todo=v('todo')=='1',f=$('#fe');
  const o={profesional_id:v('pro')||null,motivo:v('mot').trim()||null,hora_inicio:todo?'00:00':v('hi'),hora_fin:todo?'24:00':v('hf')};
  if(s)o.dia_semana=+v('dia');
  else{o.fecha=v('fecha');o.fecha_fin=v('fin')||null;if(!o.fecha){f.textContent='Elige el día.';return}if(o.fecha_fin&&o.fecha_fin<o.fecha){f.textContent='La fecha final no puede ser anterior a la inicial.';return}}
  if(!todo&&(!o.hora_inicio||!o.hora_fin||o.hora_fin<=o.hora_inicio)){f.textContent='Revisa las horas: "Hasta" debe ser después de "Desde".';return}
  try{await api('bloqueos',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(o)});await showBl()}catch(e){f.textContent=e.detail||'No se pudo guardar.'}}

let snapM=null,AC=null,needTap=false,snd=(()=>{try{return localStorage.getItem('sh-snd')!='0'}catch(e){return true}})();
function unlock(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();needTap=false}catch(e){}}
function tone(f,t0,d){const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.3,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05)}
function chime(k){if(!snd)return;if(!AC||AC.state!='running'){needTap=true;return}
  if(k=='nueva'){tone(660,0,.28);tone(880,.2,.4)}else{tone(784,0,.2);tone(988,.16,.2);tone(1318,.32,.5)}
  try{navigator.vibrate&&navigator.vibrate(k=='nueva'?[120,80,120]:[200])}catch(e){}}
let ttT=null;
function note(t){const e=$('#tt');e.textContent=t;e.style.display='block';clearTimeout(ttT);ttT=setTimeout(()=>e.style.display='none',7000)}
const quien=l=>l.slice(0,2).map(r=>`${r.cliente} · ${r.hora.slice(0,5)}`).join(', ')+(l.length>2?` y ${l.length-2} más`:'');
async function watch(silent){
  let rows;try{rows=await api(`citas?select=id,estado,cliente,fecha,hora&fecha=gte.${today}&order=creada.desc&limit=300`)}catch(e){return}
  const prev=snapM;snapM={};rows.forEach(r=>snapM[r.id]=r);
  if(!prev||silent)return;
  const nuevas=rows.filter(r=>!prev[r.id]&&r.estado!='cancelada');
  const conf=rows.filter(r=>prev[r.id]&&prev[r.id].estado=='pendiente'&&r.estado=='confirmada');
  const canc=rows.filter(r=>prev[r.id]&&prev[r.id].estado!='cancelada'&&r.estado=='cancelada');
  const msgs=[];
  if(nuevas.length){chime('nueva');msgs.push('🔔 Nueva reserva: '+quien(nuevas))}
  if(conf.length){setTimeout(()=>chime('conf'),nuevas.length?900:0);msgs.push('✅ Confirmó: '+quien(conf))}
  if(canc.length)msgs.push('❌ Canceló: '+quien(canc));
  if(msgs.length){note(msgs.join('  ·  '));if(needTap)note('Toca la pantalla una vez para activar el sonido. '+msgs[0]);await reload(1)}}
const restOf=(pid,d)=>BL.filter(b=>(!b.profesional_id||b.profesional_id==pid)&&((b.fecha&&d>=b.fecha&&d<=(b.fecha_fin||b.fecha))||(b.dia_semana!=null&&b.dia_semana==new Date(d+'T12:00').getDay())));

function render(){
  const a=$('#app'),logo=w=>`<div class="hd"><img class="logo" src="${LOGO}" alt="S&H Centro de Belleza y Barbería"${w?` style="width:${w}px"`:''}></div>`;
  if(!S){a.innerHTML=logo(150)+`<div class="tag">AGENDA</div><div class="sh" style="border-radius:16px;margin-top:18px"><label>Correo<input id="em" type="email" autocomplete="username"></label><label>Contraseña<input id="pw" type="password" autocomplete="current-password"></label>${err?`<div class="msg">${esc(err)}</div>`:''}<button class="pr" style="width:100%;margin-top:14px;padding:14px" data-a="login">Entrar</button></div>`;return}
  const wk=mode=='sem',live=c=>c.estado!='cancelada';
  const list=citas.filter(c=>!fp||c.profesional_id==fp),act=list.filter(live);
  const precio=id=>svcs.find(s=>s.id==id)?.precio||0,days=[...new Set(list.map(c=>c.fecha))];
  const cnt=id=>citas.filter(c=>live(c)&&(!id||c.profesional_id==id)).length;
  const card=(c,eq)=>{const s=svcs.find(x=>x.id==c.servicio_id),p=pros.find(x=>x.id==c.profesional_id),h=c.hora.slice(0,5),open=c.estado=='pendiente'||c.estado=='confirmada';
    return `<div class="c ${c.estado}" style="--pc:${p?.color||'#d4af37'}"><h3><span><em>${h}</em> – ${tm(mn(h)+c.dur_min)}</span><span class="b ${c.estado}">${c.estado}</span></h3><div class="nm">${esc(c.cliente)}</div><p>${esc(s?.nombre||'')}${eq?'':' · '+esc(p?.nombre||'')}${c.notas?' · '+esc(c.notas):''}</p><p>${esc(c.telefono)}</p><div class="acts">${c.estado=='pendiente'?`<button class="pr" data-a="st" data-id="${c.id}" data-v="confirmada">Confirmar</button>`:''}${open?`<button data-a="st" data-id="${c.id}" data-v="atendida">Atendida</button><button data-a="mv" data-id="${c.id}">Mover</button><button data-a="st" data-id="${c.id}" data-v="cancelada">Cancelar</button>`:''}<button data-a="wa" data-id="${c.id}">💬 WhatsApp</button></div></div>`};
  const col=p=>{const mine=citas.filter(c=>c.profesional_id==p.id),n=mine.filter(live).length,r=restOf(p.id,date);
    return `<section class="col"><div class="ch" style="--pc:${p.color}"><b>${esc(p.nombre)}</b><span>${n?n+(n==1?' cita':' citas'):'Libre'}</span></div>${r.map(b=>`<div class="rest">☕ Descanso · ${hrs(b)}${b.motivo?' · '+esc(b.motivo):''}</div>`).join('')}${mine.length?mine.map(c=>card(c,1)).join(''):'<p class="mu">Sin citas este día.</p>'}</section>`};
  const show=fp?pros.filter(p=>p.id==fp):pros;
  let body;
  if(loading)body='<p class="mu">Cargando…</p>';
  else if(mode=='eq')body=`<div class="dh">${dl(date)}</div><div class="cols ${show.length==1?'one':''}">${show.map(col).join('')}</div>`;
  else if(!list.length)body='<p class="mu" style="text-align:center;margin-top:30px">No hay citas en este periodo.</p>';
  else if(wk)body=days.map(d=>`<div class="dh">${dl(d)}</div>`+list.filter(c=>c.fecha==d).map(c=>card(c)).join('')).join('');
  else body=`<div class="dh">${dl(date)}</div>`+list.map(c=>card(c)).join('');
  a.innerHTML=logo()+`<div class="tag">AGENDA</div>
  <div class="tools"><button data-a="bl">☕ Descansos</button><button data-a="snd">${snd?'🔔 Sonido':'🔕 Silencio'}</button><button data-a="ref">↻</button><button data-a="out">Salir</button></div>
  <div class="row"><button data-a="nav" data-n="-1">‹</button><input type="date" id="dt" value="${date}"><button data-a="nav" data-n="1">›</button><button data-a="nav" data-n="0">Hoy</button></div>
  <div class="seg"><button data-a="mode" data-v="eq" class="${mode=='eq'?'on':''}">Por profesional</button><button data-a="mode" data-v="lista" class="${mode=='lista'?'on':''}">Lista</button><button data-a="mode" data-v="sem" class="${mode=='sem'?'on':''}">Semana</button></div>
  <div class="chips"><button class="chip ${fp?'':'on'}" data-a="fp" data-v="">Todos <i>${cnt()}</i></button>${pros.map(p=>`<button class="chip ${fp==p.id?'on':''}" style="--pc:${p.color}" data-a="fp" data-v="${p.id}"><span class="d"></span>${esc(p.nombre)} <i>${cnt(p.id)}</i></button>`).join('')}</div>
  <div class="stats"><div><b>${act.length}</b><span>citas</span></div><div><b>${list.filter(c=>c.estado=='pendiente').length}</b><span>por confirmar</span></div><div><b>${money(list.filter(c=>c.estado=='atendida').reduce((s,c)=>s+precio(c.servicio_id),0))}</b><span>cobrado</span></div></div>
  ${err?`<div class="msg">${esc(err)}</div>`:''}${body}<button class="pr fab" data-a="new">+</button>`}

document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  if(a=='login')return login();
  if(a=='out'){try{localStorage.removeItem('sh-rt')}catch(x){}S=null;return render()}
  if(a=='nav'){const n=+b.dataset.n;date=n?add(date,n*(mode=='sem'?7:1)):today;return reload()}
  if(a=='mode'){mode=b.dataset.v;return reload()}
  if(a=='fp'){fp=b.dataset.v;return render()}
  if(a=='ref'){await loadBl();return reload()}
  if(a=='st'){if(b.dataset.v=='cancelada'&&!b.dataset.s){b.dataset.s=1;b.textContent='¿Seguro?';return}return upd(id,{estado:b.dataset.v})}
  if(a=='wa')return wa(id);
  if(a=='mv')return form(citas.find(c=>c.id==id));
  if(a=='new')return form({fecha:date,hora:'09:00',profesional_id:fp||pros[0]?.id,servicio_id:svcs[0]?.id});
  if(a=='snd'){snd=!snd;try{localStorage.setItem('sh-snd',snd?'1':'0')}catch(x){}unlock();if(snd)chime('nueva');return render()}
  if(a=='bl')return showBl();
  if(a=='sbl')return saveBl();
  if(a=='dbl'){if(!b.dataset.s){b.dataset.s=1;b.textContent='¿Seguro?';return}try{await api('bloqueos?id=eq.'+id,{method:'DELETE',headers:{Prefer:'return=minimal'}})}catch(x){}return showBl()}
  if(a=='close')return closeM();
  if(a=='save')return save()});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id=='dt'&&t.value){date=t.value;reload()}
  if(t.id=='b_tipo'){$('#g_f').style.display=t.value=='f'?'':'none';$('#g_s').style.display=t.value=='s'?'':'none'}
  if(t.id=='b_todo')$('#g_h').style.display=t.value=='0'?'':'none'});
$('#m').addEventListener('click',e=>{if(e.target.id=='m')closeM()});
['click','touchstart'].forEach(ev=>document.addEventListener(ev,unlock,{capture:true,passive:true}));
setInterval(async()=>{if(!S||document.hidden)return;await watch();if(!$('#m').classList.contains('on'))reload(1)},20000);
(async()=>{if(await refresh())await load();else render()})();
</script></body></html>
