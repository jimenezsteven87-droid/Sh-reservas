<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><meta name="theme-color" content="#000000"><link rel="manifest" href="manifest-agenda.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<title>S&amp;H · Agenda</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#d4af37;--g2:#f3d98b;--bd:#2f2711;--mu:#a9a9a9}
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font:15px/1.4 Montserrat,system-ui,sans-serif}
main{max-width:600px;margin:0 auto;padding:12px 14px 90px}
.hd{text-align:center}.logo{width:112px;height:auto;display:block;margin:0 auto}
.tag{text-align:center;color:var(--g);letter-spacing:.32em;font-size:10px;margin:2px 0 10px;font-weight:600}
.tools{display:flex;gap:6px;overflow-x:auto;margin:0 -14px 12px;padding:0 14px 2px;scrollbar-width:none}.tools button{flex:none;white-space:nowrap}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
input,select{width:100%;padding:12px;margin-top:8px;border:1px solid #3d3314;border-radius:10px;background:#000;color:#fff;font:16px Montserrat,system-ui,sans-serif;color-scheme:dark}
.row input{margin:0;flex:1;min-width:0}
button{border:1px solid #3d3314;background:#111;color:var(--g2);border-radius:10px;padding:10px 12px;font:600 13px Montserrat,system-ui,sans-serif;cursor:pointer}
button.pr{background:linear-gradient(135deg,var(--g2),var(--g));color:#000;border:0}
.seg{display:flex;background:#111;border:1px solid var(--bd);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:9px 4px}
.seg button.on{background:linear-gradient(135deg,var(--g2),var(--g));color:#000}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -14px 8px;padding:2px 14px 8px;scrollbar-width:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;border-radius:99px;padding:8px 12px;white-space:nowrap}
.chip i{font-style:normal;background:#000;border-radius:99px;padding:0 7px;font-size:11px;color:var(--g2)}
.chip .d{width:9px;height:9px;border-radius:50%;background:var(--pc)}
.chip.on{background:var(--g);color:#000;border-color:var(--g)}.chip.on i{background:#0003;color:#000}
.stats{display:flex;gap:10px;margin:4px 0 6px}
.stats div{flex:1;background:#111;border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}
.stats b{display:block;font-size:19px;color:var(--g2)}.stats span{font-size:11px;color:var(--mu)}
.dh{margin:14px 0 8px;color:var(--g);font-weight:700;font-size:14px}.dh::first-letter{text-transform:uppercase}
.cols{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -14px;padding:0 14px 10px}
.col{flex:0 0 min(88%,360px);scroll-snap-align:start}.cols.one .col{flex:0 0 100%}
.ch{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--pc);padding:6px 2px 8px;margin-bottom:10px}
.ch b{font-size:16px}.ch span{font-size:12px;color:var(--mu)}
.rest{background:#1a1505;border:1px dashed var(--g);color:var(--g2);border-radius:10px;padding:8px 10px;font-size:12px;margin-bottom:10px}
.c{background:linear-gradient(#131313,#0a0a0a);border:1px solid var(--bd);border-left:4px solid var(--pc);border-radius:12px;padding:12px;margin-bottom:10px}
.c.cancelada{opacity:.45}
.c h3{margin:0;font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center;color:var(--mu)}
.c h3 em{font-style:normal;font-size:19px;color:var(--g2);font-weight:700}
.nm{font-weight:700;margin-top:4px}
.c p{margin:2px 0;color:var(--mu);font-size:13px}
.b{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--g);color:var(--g2);white-space:nowrap}
.b.pendiente{border-style:dashed}.b.atendida{background:var(--g);color:#000}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
input[type=color]{height:46px;padding:4px}
textarea{width:100%;padding:12px;margin-top:8px;border:1px solid #3d3314;border-radius:10px;background:#000;color:#fff;font:15px Montserrat,system-ui,sans-serif;color-scheme:dark}
.fab{position:fixed;right:16px;bottom:18px;width:56px;height:56px;border-radius:50%;font-size:28px;padding:0;box-shadow:0 0 22px #d4af3755}
#tt{display:none;position:fixed;top:10px;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:560px;background:#1a1505;border:1px solid var(--g);color:var(--g2);border-radius:12px;padding:12px 14px;font-weight:600;font-size:13px;z-index:20;text-align:center;box-shadow:0 0 24px #d4af3755}
.msg{color:#ff7b6b;font-weight:600;margin:8px 0}.mu{color:var(--mu)}
#m{display:none;position:fixed;inset:0;background:#000b;align-items:flex-end;justify-content:center;z-index:9}#m.on{display:flex}
.sh{background:#111;border:1px solid var(--bd);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
.sh label{display:block;margin-top:10px;font-size:12px;color:var(--mu);font-weight:600}
@media(min-width:600px){#m{align-items:center}.sh{border-radius:16px}}

.lst .c{margin-bottom:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row2 input{margin-top:8px}
.pi{border:1px solid var(--bd);border-radius:10px;padding:8px;margin-top:8px}
.pi1{display:flex;gap:6px}.pi1 input{margin:0;flex:1}
.pi2{display:grid;grid-template-columns:64px 1fr 1fr;gap:6px;margin-top:6px}.pi2 input,.pi2 select{margin:0}
.tbox{margin-top:12px;padding:10px 12px;border:1px solid var(--g);border-radius:12px;background:#1a1505;font-size:14px}.tbox div{display:flex;justify-content:space-between;padding:2px 0}.tbox .big{font-size:18px;font-weight:700;color:var(--g2)}
.rtxt{margin:0;white-space:pre-wrap;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;color:#fff}
@page{margin:2mm}
@media print{body>*:not(#m){display:none!important}#m{position:static!important;background:none!important;display:block!important}.sh{border:0!important;background:#fff!important;max-width:var(--paper,80mm)!important;padding:0!important;overflow:visible!important}.sh>*:not(#rcp){display:none!important}.rtxt{color:#000!important;font-size:var(--pfs,12px)}.rtxt+.rtxt{page-break-before:always;break-before:page}}

.sh.wide{max-width:780px}
.tb{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}.tb th,.tb td{padding:9px 6px;border-bottom:1px solid var(--bd);text-align:right}.tb th:first-child,.tb td:first-child{text-align:left}.tb th{color:var(--mu);font-weight:600}
.grid{display:flex;overflow-x:auto;border:1px solid var(--bd);border-radius:12px;background:#0a0a0a}
.gtime{flex:0 0 52px;position:sticky;left:0;background:#0a0a0a;z-index:2}
.gcol{flex:1 0 150px;border-left:1px solid var(--bd)}
.gh{height:38px;display:flex;align-items:center;justify-content:center;font-weight:700;border-bottom:3px solid var(--pc,#333)}
.gbody{position:relative;background:repeating-linear-gradient(to bottom,transparent 0,transparent 59px,#2a2410 59px,#2a2410 60px);cursor:cell}
.tl{position:absolute;right:6px;font-size:11px;color:var(--mu);margin-top:3px}
.gb{position:absolute;left:3px;right:3px;border-radius:8px;padding:3px 6px;font-size:12px;overflow:hidden;background:color-mix(in srgb,var(--pc) 26%,#0a0a0a);border-left:4px solid var(--pc);cursor:pointer;line-height:1.25}
.gb small{display:block;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gb.pendiente{border-left-style:dashed}.gb.atendida{opacity:.65}
.gr{position:absolute;left:0;right:0;background:repeating-linear-gradient(45deg,#1a1505,#1a1505 6px,#241c07 6px,#241c07 12px);color:var(--g2);font-size:11px;padding:4px 6px;border-top:1px dashed var(--g);overflow:hidden;pointer-events:none}
@media(hover:hover){button:hover{filter:brightness(1.18)}.gb:hover{filter:brightness(1.25)}}
@media(min-width:900px){
 main{max-width:1280px;padding:18px 28px 90px}
 .head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:14px}
 .brand{display:flex;align-items:center;gap:14px}.brand .logo{width:78px;margin:0}.brand .tag{margin:0}
 .tools{margin:0;padding:0;overflow:visible;flex-wrap:wrap;justify-content:flex-end}
 .row{max-width:460px}.seg{max-width:560px}.stats{max-width:720px}
 .chips{margin:0 0 8px;padding:2px 0 8px;flex-wrap:wrap}
 .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;overflow:visible;margin:0;padding:0}.col{flex:none}
 .lst{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}.lst .c{margin:0}
 .gcol{flex:1 0 190px}.gb{font-size:13px}
}
</style></head><body><main id="app"></main><div id="m"></div><div id="tt"></div>

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const add=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const tm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const mn=t=>{const[a,b]=t.split(':');return +a*60+ +b};
const money=n=>'$'+String(Math.round(Number(n||0))).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const choque=e=>e.status==409||/sin_choques|exclusion|conflicting/i.test(e.detail||'');
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const hrs=b=>b.hora_inicio.slice(0,5)=='00:00'&&b.hora_fin.slice(0,5)=='24:00'?'todo el día':`${b.hora_inicio.slice(0,5)}–${b.hora_fin.slice(0,5)}`;
const dl=d=>new Date(d+'T12:00').toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'});
const today=iso(new Date());
let S=null,svcs=[],pros=[],citas=[],BL=[],date=today,mode=matchMedia('(min-width:900px)').matches?'cal':'eq',fp='',err='',loading=false;

async function raw(p,o={}){
  const h={apikey:CFG.KEY,'Content-Type':'application/json',...(S?{Authorization:'Bearer '+S.access_token}:{}),...(o.headers||{})};
  const r=await fetch(CFG.URL+p,{...o,headers:h});const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok){const e=new Error('http');e.status=r.status;e.detail=(j&&(j.message||j.msg||j.error_description))||'';throw e}return j}
async function auth(body,grant){S=null;const j=await raw('/auth/v1/token?grant_type='+grant,{method:'POST',body:JSON.stringify(body)});S=j;try{localStorage.setItem('sh-rt',j.refresh_token)}catch(e){}}
async function refresh(){try{const rt=localStorage.getItem('sh-rt');if(!rt)return false;await auth({refresh_token:rt},'refresh_token');return true}catch(e){S=null;return false}}
async function api(p,o){try{return await raw('/rest/v1/'+p,o)}catch(e){if(e.status==401&&await refresh())return raw('/rest/v1/'+p,o);throw e}}

async function login(){const em=$('#em').value.trim(),pw=$('#pw').value;err='';
  try{await auth({email:em,password:pw},'password');await load()}catch(e){S=null;err=e.status==400?'Correo o contraseña incorrectos.':'No se pudo iniciar sesión.';render()}}
async function loadBl(){try{BL=await api(`bloqueos?select=*&or=(fecha.is.null,fecha.gte.${today},fecha_fin.gte.${today})&order=fecha.nullsfirst,dia_semana`)}catch(e){BL=[]}}
async function load(){await getRol();if(ROL.rol=='pro')return loadPro();if(ROL.rol=='nada'){loading=false;return render()}loading=true;render();
  try{await Promise.all([loadSv(),loadPr()]);await Promise.all([loadCitas(),loadBl()]);err=''}
  catch(e){err='No se pudieron cargar los datos.'}loading=false;render();watch(true);pushInit()}
async function reload(q){if(ROL.rol=='pro')return loadPro(q);if(!q){loading=true;render()}try{await loadCitas();err=''}catch(e){err='No se pudieron cargar las citas.'}loading=false;render()}
async function upd(id,body){try{await api('citas?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});err=''}catch(e){err=choque(e)?'Ese horario ya está ocupado.':'No se pudo guardar el cambio.'}await reload(1);await watch(true)}

function wa(id){const c=citas.find(x=>x.id==id)||MAN.find(x=>x.id==id),s=svcs.find(x=>x.id==c.servicio_id),p=pros.find(x=>x.id==c.profesional_id);
  let ph=c.telefono.replace(/\D/g,'');if(ph.length==10&&ph[0]=='3')ph='57'+ph;
  const t=`Hola ${c.cliente}, te recordamos tu cita en ${CFG.NOMBRE}: ${svNames(c)||'servicio'} con ${p?.nombre||'nuestro equipo'}, ${dl(c.fecha)} a las ${c.hora.slice(0,5)}. Puedes confirmar, reagendar o cancelar aquí: ${CFG.RESERVA}?t=${c.token}`;
  window.open(`https://wa.me/${ph}?text=${encodeURIComponent(t)}`,'_blank')}

function closeM(){fsv=[];$('#m').classList.remove('on');render()}
let fsv=[];
const sOpts=sel=>svcs.filter(s=>s.activo!==false||s.id==sel).map(s=>`<option value="${s.id}"${s.id==sel?' selected':''}>${esc(s.nombre)} · ${s.dur_min} min</option>`).join('');
const totSv=ids=>{const l=ids.map(id=>svcs.find(s=>s.id==id)).filter(Boolean);return{d:l.reduce((a,s)=>a+s.dur_min,0),p:l.reduce((a,s)=>a+(s.precio||0),0)}};
const readSv=()=>{fsv=[...document.querySelectorAll('[data-sv]')].map(x=>x.value)};
const readForm=()=>{const v=k=>$('#f_'+k)?.value||'';return{cliente:v('cliente'),telefono:v('telefono'),profesional_id:v('profesional_id'),fecha:v('fecha'),hora:v('hora')}};
function form(c){const nw=!c.id;
  if(nw&&!fsv.length)fsv=[svcs.find(s=>s.activo!==false)?.id];
  const t=totSv(fsv);
  $('#m').innerHTML=`<div class="sh"><h3 style="margin:0;color:var(--g2)">${nw?'Nueva cita':'Mover cita'}</h3>${nw?`<datalist id="dl_cli">${CLI.map(x=>`<option value="${esc(x.nombre)}">${esc(x.telefono)}</option>`).join('')}</datalist><datalist id="dl_tel">${CLI.map(x=>`<option value="${esc(x.telefono)}">${esc(x.nombre)}</option>`).join('')}</datalist><label>Cliente<input id="f_cliente" list="dl_cli" autocomplete="off" value="${esc(c.cliente||'')}"></label><label>Celular<input id="f_telefono" list="dl_tel" type="tel" placeholder="3001234567" autocomplete="off" value="${esc(c.telefono||'')}"></label><label>Servicios</label>${fsv.map((id,i)=>`<div class="row" style="margin-top:6px"><select data-sv="${i}">${sOpts(id)}</select>${fsv.length>1?`<button data-a="rsv" data-i="${i}">✕</button>`:''}</div>`).join('')}${fsv.length<4?'<button data-a="asv">+ Agregar otro servicio</button>':''}<p class="mu">Total: ${t.d} min${t.p>0?' · '+money(t.p):''}</p>`:`<p class="mu">${esc(c.cliente)}</p>`}<label>Profesional<select id="f_profesional_id">${pros.filter(p=>p.activo!==false||p.id==c.profesional_id).map(p=>`<option value="${p.id}"${p.id==c.profesional_id?' selected':''}>${esc(p.nombre)}</option>`).join('')}</select></label><label>Fecha<input id="f_fecha" type="date" value="${c.fecha}"></label><label>Hora<input id="f_hora" type="time" step="900" value="${(c.hora||'09:00').slice(0,5)}"></label><div class="msg" id="fe"></div><div class="acts"><button data-a="close">Cancelar</button><button class="pr" data-a="save" data-id="${c.id||''}">Guardar</button></div></div>`;
  $('#m').classList.add('on')}
async function save(){const id=$('[data-a=save]').dataset.id,v=k=>$('#f_'+k)?.value.trim(),f=$('#fe');
  const o={profesional_id:v('profesional_id'),fecha:v('fecha'),hora:v('hora')};
  if(!o.fecha||!o.hora){f.textContent='Completa fecha y hora.';return}
  try{
    if(id)await api('citas?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({...o,recordatorio_enviado_at:null})});
    else{readSv();const nm=v('cliente');let ph=(v('telefono')||'').replace(/\D/g,'');if(ph.length==10&&ph[0]=='3')ph='57'+ph;
      if(nm.length<2||ph.length<8){f.textContent='Escribe nombre y celular.';return}
      if(new Set(fsv).size<fsv.length){f.textContent='Hay servicios repetidos.';return}
      await api('rpc/crear_cita_admin',{method:'POST',body:JSON.stringify({p_pro:o.profesional_id,p_fecha:o.fecha,p_hora:o.hora,p_servicios:fsv,p_cliente:nm,p_telefono:ph,p_estado:'confirmada'})});CLI=[]}
    fsv=[];$('#m').classList.remove('on');await reload(1);await watch(true)
  }catch(e){f.textContent=choque(e)?'Ese horario ya está ocupado.':(e.status==404?'Falta ejecutar el SQL de servicios múltiples en Supabase.':(e.detail||'No se pudo guardar.'))}}
async function showBl(){

const dow1=d=>{const x=new Date(d+'T12:00'),k=(x.getDay()+6)%7;return add(d,-k)};
function repRange(){if(RP=='dia')return[RA,RA];if(RP=='sem'){const a=dow1(RA);return[a,add(a,6)]}const[y,m]=RA.split('-').map(Number);return[RA.slice(0,7)+'-01',RA.slice(0,7)+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0')]}
function repNav(n){if(RP=='dia')RA=add(RA,n);else if(RP=='sem')RA=add(RA,7*n);else{const[y,m]=RA.split('-').map(Number),d=new Date(y,m-1+n,1);RA=iso(d)}}
function repTitle(){const[a,b]=repRange(),f=d=>new Date(d+'T12:00').toLocaleDateString('es',{day:'numeric',month:'short'});
  if(RP=='dia'){const t=dl(a);return t.charAt(0).toUpperCase()+t.slice(1)}if(RP=='sem')return f(a)+' – '+f(b);const t=new Date(a+'T12:00').toLocaleDateString('es',{month:'long',year:'numeric'});return t.charAt(0).toUpperCase()+t.slice(1)}
async function repLoad(){const[d1,d2]=repRange();let vs=[],leg=[],err=false;
  try{vs=await fetchAll(`ventas?select=*,venta_items(*)&fecha=gte.${d1}&fecha=lte.${d2}&anulada=eq.false&order=fecha,hora`)}catch(e){err=true}
  try{leg=await qCitas(`&estado=eq.atendida&fecha=gte.${d1}&fecha=lte.${d2}&order=fecha,hora,id`)}catch(e){}
  leg=leg.filter(c=>!vs.some(v=>v.cita_id==c.id));RD={vs,leg,err}}
function repCalc(){const{vs,leg}=RD,R={};
  const com=id=>{const p=pros.find(x=>x.id==id);return p&&p.comision!=null?+p.comision:60};
  const ce=(f,id)=>{const k=f+'|'+(id||'');return R[k]=R[k]||{fecha:f,id:id||'',serv:0,prod:0,prop:0,com:0,n:0}};
  vs.forEach(v=>{const sub=+v.subtotal,f=sub>0?(+v.total)/sub:1;
    (v.venta_items||[]).forEach(i=>{const pid=i.profesional_id||v.profesional_id,net=(+i.cantidad)*(+i.precio)*f,r=ce(v.fecha,pid);
      if(i.tipo=='servicio'){r.serv+=net;r.com+=net*com(pid)/100;r.n+=+i.cantidad}else r.prod+=net});
    if(+v.propina>0)ce(v.fecha,v.profesional_id).prop+=+v.propina});
  leg.forEach(c=>{const val=valor(c),r=ce(c.fecha,c.profesional_id);r.serv+=val;r.com+=val*com(c.profesional_id)/100;r.n++});
  const rows=Object.values(R).map(r=>({...r,ing:r.serv+r.prod,sal:r.serv+r.prod-r.com}));
  const sum=l=>l.reduce((a,r)=>({serv:a.serv+r.serv,prod:a.prod+r.prod,prop:a.prop+r.prop,com:a.com+r.com,n:a.n+r.n,ing:a.ing+r.ing,sal:a.sal+r.sal}),{serv:0,prod:0,prop:0,com:0,n:0,ing:0,sal:0});
  const byP={};rows.forEach(r=>(byP[r.id]=byP[r.id]||[]).push(r));
  const pl=Object.entries(byP).map(([id,l])=>({id,nombre:id?proNom(id)||'(profesional eliminado)':'Sin asignar',...sum(l)})).sort((a,b)=>b.ing-a.ing);
  const sel=RF?rows.filter(r=>r.id==RF):rows,byD={};sel.forEach(r=>(byD[r.fecha]=byD[r.fecha]||[]).push(r));
  const dl2=Object.entries(byD).sort((a,b)=>a[0].localeCompare(b[0])).map(([f,l])=>({fecha:f,...sum(l)}));
  return{pl,dl:dl2,all:sum(rows),sel:sum(sel)}}

  <p class="mu" style="font-size:12px">Ingresos = servicios + productos, ya con descuento. La comisión se calcula solo sobre servicios (porcentaje de cada profesional); los productos son del salón. Las propinas son del profesional y no cuentan como ingreso del salón. “A pagar” = comisión + propinas.</p>

const b64u=s=>{const r=atob((s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))};
async function pushInit(){PS='no';
  if(VAPID_PUB&&'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window){
    try{const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();PS=sub&&Notification.permission=='granted'?'on':'off'}catch(e){PS='no'}}
  if(S&&ROL.rol=='dueno')render()}
async function pushOn(){try{
    if(await Notification.requestPermission()!='granted'){note('Permite las notificaciones en el navegador para activar los avisos.');return}
    const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUB)});
    const j=sub.toJSON();await api('push_subs?on_conflict=endpoint',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth})});
    PS='on';note('✅ Avisos activados en este celular.')}catch(e){note('No se pudieron activar los avisos.')}render()}
async function pushOff(){try{const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();
    if(sub){try{await api('push_subs?endpoint=eq.'+encodeURIComponent(sub.endpoint),{method:'DELETE',headers:{Prefer:'return=minimal'}})}catch(e){}await sub.unsubscribe()}
    PS='off';note('Avisos desactivados en este celular.')}catch(e){note('No se pudieron desactivar los avisos.')}render()}

    if(k=='rjson'){const [ci,se,pr,bl,ho,no]=await Promise.all([qCitas('&order=fecha,hora,id'),fetchAll('servicios?select=*&order=id'),fetchAll('profesionales?select=*&order=id'),fetchAll('bloqueos?select=*&order=id'),fetchAll('horarios?select=*&order=id').catch(()=>[]),fetchAll('clientes_notas?select=*&order=telefono').catch(()=>[])]);
      const [ve,ga,ca]=await Promise.all([fetchAll('ventas?select=*,venta_items(*),venta_pagos(*)&order=id').catch(()=>[]),fetchAll('gastos?select=*&order=id').catch(()=>[]),fetchAll('cajas?select=*&order=fecha').catch(()=>[])]);
      const [pd,sm]=await Promise.all([fetchAll('productos?select=*&order=nombre').catch(()=>[]),fetchAll('stock_mov?select=*&order=creado').catch(()=>[])]);
      bajar(`respaldo-sh-${today}.json`,JSON.stringify({creado:new Date().toISOString(),productos:pd,stock_mov:sm,citas:ci,servicios:se,profesionales:pr,bloqueos:bl,horarios:ho,clientes_notas:no,ventas:ve,gastos:ga,cajas:ca},null,1),'json')}

      bajar(`citas-sh-${today}.csv`,toCsv(['fecha','hora','cliente','telefono','profesional','servicios','duracion_min','estado','valor','notas'],ci.map(c=>({fecha:c.fecha,hora:c.hora.slice(0,5),cliente:c.cliente,telefono:c.telefono,profesional:proNom(c.profesional_id),servicios:svNames(c),duracion_min:c.dur_min,estado:c.estado,valor:c.estado=='atendida'?valor(c):'',notas:c.notas}))),'csv')}
    else{await loadCli();if(CLIERR)throw new Error('cli');
      bajar(`clientes-sh-${today}.csv`,toCsv(['nombre','telefono','citas','visitas','ultima','gastado','notas'],CLI.map(c=>({...c,notas:NOTAS[c.telefono]||''}))),'csv')}
    try{localStorage.setItem('sh-resp',today)}catch(e){}
    f.textContent='Listo ✓ Revisa tu carpeta de descargas.'}
  catch(e){f.style.color='#ff7b6b';f.textContent=CLIERR&&k=='rclientes'?'Falta ejecutar el SQL de clientes en Supabase.':'No se pudo preparar la descarga. Intenta de nuevo.'}}
const respBanner=()=>{let l=null;try{l=localStorage.getItem('sh-resp')}catch(e){return''}const d=l?Math.floor((new Date(today+'T12:00')-new Date(l+'T12:00'))/864e5):999;

function noLab(pid,d){const hs=HOR.filter(h=>h.profesional_id==pid);if(!hs.length)return[];const dow=new Date(d+'T12:00').getDay(),r=hs.filter(h=>h.dia_semana==dow).map(h=>[mn(h.hora_inicio.slice(0,5)),mn(h.hora_fin.slice(0,5))]).sort((a,b)=>a[0]-b[0]),g=[];let cur=0;for(const[a,b]of r){if(a>cur)g.push([cur,a]);cur=Math.max(cur,b)}if(cur<1440)g.push([cur,1440]);return g}

  if(a=='wa')return wa(id);
  if(a=='mv')return form(citas.find(c=>c.id==id));
  if(a=='new'){fsv=[];await ensureCli();return form({fecha:date,hora:'09:00',profesional_id:fp||prosA()[0]?.id})}
  if(a=='snd'){snd=!snd;try{localStorage.setItem('sh-snd',snd?'1':'0')}catch(x){}unlock();if(snd)chime('nueva');return render()}
  if(a=='pr')return showPr();
  if(a=='epr')return formPr(id);
  if(a=='spr')return savePr(id);
  if(a=='sv')return showSv();
  if(a=='esv')return formSv(id);
  if(a=='ssv')return saveSv(id);
  if(a=='bl')return showBl();
  if(a=='sbl')return saveBl();
  if(a=='dbl'){if(!b.dataset.s){b.dataset.s=1;b.textContent='¿Seguro?';return}try{await api('bloqueos?id=eq.'+id,{method:'DELETE',headers:{Prefer:'return=minimal'}})}catch(x){}return showBl()}
  if(a=='ina')return showIna();
  if(a=='inad'){INA=+b.dataset.n;return drawIna()}
  if(a=='wai'){const t=b.dataset.t,c=CLI.find(x=>x.telefono==t);window.open(`https://wa.me/${t}?text=${encodeURIComponent(`Hola ${(c?.nombre||'').split(' ')[0]}, hace tiempo no te vemos por ${CFG.NOMBRE} 💛 Nos encantaría consentirte de nuevo. Reserva tu cita aquí: ${CFG.RESERVA}`)}`,'_blank');const mk=inaMark();mk[t]=today;try{localStorage.setItem('sh-ina',JSON.stringify(mk))}catch(x){}return drawIna()}
  if(a=='pos')return posOpen();
  if(a=='prod')return showProd();
  if(a=='nprod')return formProd();
  if(a=='eprod')return formProd(id);
  if(a=='sprod')return saveProd(id);
  if(a=='aprod')return formEnt(id);
  if(a=='sent')return saveEnt(id);
  if(a=='hist')return showHist();
  if(a=='hm'){const n=+b.dataset.n,[y,m]=HM.split('-').map(Number);HM=n?iso(new Date(y,m-1+n,1)).slice(0,7):today.slice(0,7);await histLoad();return drawHist()}
  if(a=='cjd'){CJ=b.dataset.d;return showCaja()}
  if(a=='hcsv')return histCsv();
  if(a=='imp')return showImp();
  if(a=='impt')return impTest();
  if(a=='pid'){posRead();POS.items.splice(+b.dataset.i,1);return posRender()}
  if(a=='pprod'){posRead();POS.items.push({tipo:'producto',servicio_id:null,descripcion:'',cantidad:1,precio:'',pro:''});return posRender()}
  if(a=='pga'){posRead();POS.pagos.push({m:'efectivo',v:''});return posRender()}
  if(a=='pgd'){posRead();POS.pagos.splice(+b.dataset.i,1);return posRender()}
  if(a=='pguardar')return posSave();
  if(a=='vrc')return posRecibo(id);
  if(a=='rwa'){const t=(VR.telefono||'').replace(/\D/g,'');return window.open((t?`https://wa.me/${t}`:'https://wa.me/')+'?text='+encodeURIComponent(reciboTxt(VR)),'_blank')}
  if(a=='rpr')return window.print();
  if(a=='rsp'){RSPLIT=!RSPLIT;return drawRecibo()}
  if(a=='ranu'){if(!b.dataset.s){b.dataset.s=1;b.textContent='¿Seguro? Toca otra vez';return}try{await api('rpc/anular_venta',{method:'POST',body:JSON.stringify({p_venta:id,p_motivo:'Anulada desde la agenda'})});$('#m').classList.remove('on');await reload(1);note('Venta anulada.')}catch(x){$('#fe').textContent='No se pudo anular la venta.'}return}
  if(a=='capt'){const v=$('#cj_ap').value;if(v===''||+v<0)return note('Escribe la base inicial.');try{await api('cajas?on_conflict=fecha',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({fecha:CJ,apertura:+v})});note('✅ Base guardada.')}catch(x){note('No se pudo guardar la base.')}return showCaja()}
  if(a=='gadd'){const c=$('#g_c').value.trim(),m=$('#g_m').value;if(c.length<2||m===''||+m<=0)return note('Escribe el concepto y el monto del gasto.');try{await api('gastos',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({fecha:CJ,concepto:c,monto:+m,metodo:$('#g_t').value})})}catch(x){note('No se pudo guardar el gasto.')}return showCaja()}
  if(a=='gdel'){if(!b.dataset.s){b.dataset.s=1;b.textContent='¿Seguro?';return}try{await api('gastos?id=eq.'+id,{method:'DELETE',headers:{Prefer:'return=minimal'}})}catch(x){}return showCaja()}
  if(a=='ccie'){const v=$('#cj_con').value;if(v===''||+v<0)return note('Escribe el efectivo contado.');const cb={fecha:CJ,apertura:+(CAJ.caja?.apertura||0),contado:+v,cerrada_at:new Date().toISOString()},post=b=>api('cajas?on_conflict=fecha',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(b)});try{try{await post({...cb,esperado:Math.round(CAJ.calc?.esp||0),ventas:Math.round(CAJ.calc?.venta||0)})}catch(e2){await post(cb)}note('✅ Caja cerrada.')}catch(x){note('No se pudo cerrar la caja.')}return showCaja()}
  if(a=='man')return showMan();
  if(a=='wam'){wa(id);const mk=manMark();mk[id]=today;try{localStorage.setItem('sh-wam',JSON.stringify(mk))}catch(x){}return drawMan()}
  if(a=='caja')return showCaja();
  if(a=='cjn'){const n=+b.dataset.n;CJ=n?add(CJ,n):today;return showCaja()}
  if(a=='cjcsv')return cajaCsv();
  if(a=='push')return PS=='on'?pushOff():pushOn();
  if(a=='dpro')return accSet(id,true);
  if(a=='qpro')return accSet(id,false);
  if(a=='rep')return showRep();
  if(a=='rm'){const n=+b.dataset.n;if(n)repNav(n);else RA=today;await repLoad();return drawRep()}
  if(a=='rp'){RP=b.dataset.v;await repLoad();return drawRep()}
  if(a=='rv'){RV=b.dataset.v;return drawRep()}
  if(a=='rcsv')return repCsv();
  if(a=='resp')return showResp();
  if(a=='rjson'||a=='rcitas'||a=='rclientes')return respaldo(a);
  if(a=='pnew'){PSV=[PSVC[0]?.id||''];return pForm()}
  if(a=='psa'){const d=pRead();const nx=PSVC.find(s=>!PSV.includes(s.id));if(nx)PSV.push(nx.id);return pForm(d)}
  if(a=='prs'){const d=pRead();PSV.splice(+b.dataset.i,1);return pForm(d)}
  if(a=='psave')return pSave();
  if(a=='gc')return showCita(id);
  if(a=='gs'){const r=b.getBoundingClientRect(),t=+b.dataset.ini+Math.floor((e.clientY-r.top)/30)*30;fsv=[];await ensureCli();return form({fecha:date,hora:tm(t),profesional_id:b.dataset.pro})}
  if(a=='cli')return showCli();
  if(a=='fic')return ficha(b.dataset.t);
  if(a=='ncli'){const t=b.dataset.t;try{await api('clientes_notas',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({telefono:t,nombre:CLI.find(x=>x.telefono==t)?.nombre||'',notas:$('#n_cli').value.trim(),actualizado:new Date().toISOString()})});NOTAS[t]=$('#n_cli').value.trim();note('✅ Notas guardadas')}catch(x){note('No se pudieron guardar las notas.')}return}
  if(a=='wcli'){const t=b.dataset.t;return window.open(`https://wa.me/${t}?text=${encodeURIComponent('Hola '+(CLI.find(x=>x.telefono==t)?.nombre||'')+', te escribimos de '+CFG.NOMBRE+'.')}`,'_blank')}
  if(a=='ncita'){const t=b.dataset.t,c=CLI.find(x=>x.telefono==t);fsv=[];return form({fecha:date,hora:'09:00',profesional_id:fp||prosA()[0]?.id,cliente:c?.nombre||'',telefono:t})}
  if(a=='asv'||a=='rsv'){readSv();const d=readForm();if(a=='asv'){const nx=svcs.find(s=>s.activo!==false&&!fsv.includes(s.id));if(nx)fsv.push(nx.id)}else fsv.splice(+b.dataset.i,1);return form(d)}
  if(a=='inst'){DI.prompt();try{await DI.userChoice}catch(x){}DI=null;return render()}
  if(a=='close')return closeM();
  if(a=='save')return save()});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.psv!==undefined){const d=pRead();pForm(d)}
  if(t.dataset.sv!==undefined){readSv();form(readForm())}
  if(t.id=='dt'&&t.value){date=t.value;reload()}
  if(t.id=='b_tipo'){$('#g_f').style.display=t.value=='f'?'':'none';$('#g_s').style.display=t.value=='s'?'':'none'}
  if(t.id=='b_todo')$('#g_h').style.display=t.value=='0'?'':'none';
  if(t.id=='p_hor')$('#g_hor').style.display=t.value=='1'?'block':'none';
  if(t.id=='rep_f'){RF=t.value;drawRep()}
  if(t.id=='p_ctl')$('#g_stk').style.display=t.value=='1'?'':'none';
  if(t.id=='imp_pap'){setLS('sh-pap',t.value);applyPaper()}
  if(t.id=='imp_ap')setLS('sh-ap',t.value);
  if(t.id=='imp_aps')setLS('sh-aps',t.value);
  if(t.id=='cj_dt'&&t.value){CJ=t.value;showCaja()}
  if(/^(pi_|pg_|pos_)/.test(t.id)){if(t.id=='pos_add'){if(t.value){posRead();const s=svcs.find(x=>x.id==t.value);if(s)POS.items.push({tipo:'servicio',servicio_id:s.id,descripcion:s.nombre,cantidad:1,precio:s.precio>0?s.precio:'',pro:POS.pro});posRender()}}else if(t.id=='pos_addp'){if(t.value){posRead();const x=PROD.find(y=>y.id==t.value);if(x)POS.items.push({tipo:'producto',servicio_id:null,producto_id:x.id,descripcion:x.nombre,cantidad:1,precio:x.precio>0?x.precio:'',pro:POS.pro});posRender()}}else posInput(t)}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id=='q_cli')$('#cli_list').innerHTML=cliRows(t.value);
  if(t.id=='pos_cli'){const m=CLI.find(x=>x.nombre.toLowerCase()==t.value.trim().toLowerCase()),p=$('#pos_tel');if(m&&p&&!p.value)p.value=m.telefono}
  if(/^(pi_|pg_|pos_)/.test(t.id)&&t.id!='pos_add'&&t.id!='pos_addp')posInput(t);
  if(t.id=='f_cliente'){const m=CLI.find(x=>x.nombre.toLowerCase()==t.value.trim().toLowerCase()),p=$('#f_telefono');if(m&&p&&!p.value)p.value=m.telefono}
  if(t.id=='f_telefono'){let d=t.value.replace(/\D/g,'');if(d.length==10&&d[0]=='3')d='57'+d;const m=CLI.find(x=>x.telefono==d),n=$('#f_cliente');if(m&&n&&!n.value)n.value=m.nombre}});
$('#m').addEventListener('click',e=>{if(e.target.id=='m')closeM()});
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&$('#m').classList.contains('on'))closeM()});
['click','touchstart'].forEach(ev=>document.addEventListener(ev,unlock,{capture:true,passive:true}));
/* consultas ligeras: se pregunta cada 30 s solo si cambió algo; la agenda completa se recarga solo cuando hay cambios (o cada ~5 min) */
let tick=0,lastPoll=0;
setInterval(async()=>{if(!S||document.hidden)return;tick++;const hr=new Date().getHours();
  if((hr<7||hr>=22)&&Date.now()-lastPoll<3e5)return;lastPoll=Date.now();
  const modal=$('#m').classList.contains('on');
  if(ROL.rol=='dueno'){const c=await watch();if(!c&&!modal&&tick%10==0)reload(1)}
  else if(ROL.rol!='nada'&&!modal&&tick%2==0)reload(1)},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S&&ROL.rol=='dueno')watch()});
let DI=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DI=e;if(S)render()});
window.addEventListener('appinstalled',()=>{DI=null;if(S)render()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
(async()=>{if(await refresh())await load();else render()})();
</script></body></html>
