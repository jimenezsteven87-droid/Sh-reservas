<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reserva tu cita</title>
<title>S&amp;H · Reserva tu cita</title><meta name="theme-color" content="#000000"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#d4af37;--g2:#f3d98b;--bd:#2f2711;--mu:#a9a9a9}
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font:16px/1.45 Montserrat,system-ui,sans-serif}
main{max-width:480px;margin:0 auto;padding:16px 16px 48px}
.hd{text-align:center;padding-top:6px}
.logo{width:min(58%,230px);height:auto;display:block;margin:0 auto}
.tag{text-align:center;color:var(--g);letter-spacing:.26em;font-size:11px;text-transform:uppercase;margin:4px 0 20px}
.st{background:linear-gradient(#131313,#0a0a0a);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.st h3{margin:0 0 4px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px}
.st h3 i{font-style:normal;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--g2),var(--g));color:#000;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
input,select{width:100%;padding:13px;margin-top:10px;border:1px solid #3d3314;border-radius:10px;background:#000;color:#fff;font:16px Montserrat,system-ui,sans-serif;color-scheme:dark}
input:focus,select:focus{outline:2px solid var(--g);border-color:var(--g)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.slots button{padding:11px 0;border-radius:10px;border:1px solid #3d3314;background:#000;color:var(--g2);font:600 14px Montserrat,system-ui,sans-serif;cursor:pointer}
.slots button.on{background:linear-gradient(135deg,var(--g2),var(--g));color:#000;border-color:var(--g)}
.go{display:block;width:100%;margin-top:14px;padding:16px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--g2),var(--g));color:#000;font:700 15px Montserrat,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;text-align:center;text-decoration:none;cursor:pointer;box-shadow:0 0 22px #d4af3744}
.sum{margin-top:14px;text-align:center;color:var(--g2);font-size:14px;font-weight:600}
.msg{margin-top:12px;color:#ff7b6b;font-weight:600;text-align:center}
.mu{color:var(--mu);font-size:14px}
.note{margin:18px 0 0;text-align:center;color:var(--mu);font-size:14px}
.note a{color:var(--g)}
.foot{margin:22px 0 0;text-align:center;color:#666;font-size:12px;letter-spacing:.1em}
.ok{text-align:center;padding:24px 16px}
.ok h2{margin:12px 0 6px;color:var(--g2)}
.chk{width:56px;height:56px;margin:0 auto;border-radius:50%;background:linear-gradient(135deg,var(--g2),var(--g));color:#000;font-size:30px;font-weight:700;display:grid;place-items:center}
.hp{position:absolute;left:-9999px}
.alt{display:block;width:100%;margin-top:10px;padding:14px;border-radius:12px;border:1px solid var(--g);background:transparent;color:var(--g2);font:600 14px Montserrat,system-ui,sans-serif;cursor:pointer}
</style></head><body><main id="app"></main>

// ====== CONFIGURA AQUÍ ======
const CFG={
  URL:'https://fbyhcgkyzegsruvydebi.supabase.co',   // Project URL de Supabase
  KEY:'sb_publishable_M3xs3ZOTv2JDoB25vIe19A_BUeDFoKp',               // clave publicable (anon) de Supabase
  WA:'573133876496',                                    // WhatsApp del negocio con código de país, ej. 56912345678
  NOMBRE:'S&H',
  ABRE:9, CIERRA:19, PASO:30, DIAS:60       // horario, intervalo en minutos y días por adelantado
};
// ============================
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const tm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const mn=t=>{const[a,b]=t.split(':');return +a*60+ +b};
const api=async(p,o={})=>{const r=await fetch(CFG.URL+'/rest/v1/'+p,{...o,headers:{apikey:CFG.KEY,'Content-Type':'application/json',...(o.headers||{})}});
  if(!r.ok){let d='';try{const j=await r.json();d=j.message||j.hint||j.code||''}catch(_){}const e=new Error('http');e.status=r.status;e.detail=d;throw e}const tx=await r.text();return tx?JSON.parse(tx):null};
const today=iso(new Date()),maxd=iso(new Date(Date.now()+CFG.DIAS*864e5));
let svcs=[],pros=[],rel=[],busy=[],done=null,msg='',S={svc:'',pro:'',date:today,time:'',name:'',phone:'',hp:''};

function prosFor(){const ids=rel.filter(r=>r.servicio_id==S.svc).map(r=>r.profesional_id);return ids.length?pros.filter(p=>ids.includes(p.id)):pros}
function fixPro(){const l=prosFor();if(!l.some(p=>p.id==S.pro))S.pro=l[0]?.id}
async function loadBusy(){busy=[];S.off=false;if(!S.pro)return;
  try{busy=await api('rpc/ocupados',{method:'POST',body:JSON.stringify({p_prof:S.pro,p_fecha:S.date})})}
  catch(e){msg='No pudimos consultar los horarios. Intenta de nuevo.'}
  try{S.off=(await api('rpc/esta_de_descanso',{method:'POST',body:JSON.stringify({p_prof:S.pro,p_fecha:S.date})}))===true}catch(e){S.off=false}}
async function load(){if(TOKEN)return loadManage();
  try{[svcs,pros,rel]=await Promise.all([
    api('servicios?select=id,nombre,dur_min,precio&activo=eq.true&order=nombre'),
    api('profesionales?select=id,nombre&activo=eq.true&order=nombre'),
    api('profesional_servicio?select=profesional_id,servicio_id').catch(()=>[])]);
    S.svc=svcs[0]?.id;fixPro();await loadBusy()}
  catch(e){msg='No pudimos cargar la agenda. Intenta de nuevo más tarde.'}
  render()}
function slots(){
  const s=svcs.find(x=>x.id==S.svc);if(!s)return[];
  const n=new Date(),nm=S.date==today?n.getHours()*60+n.getMinutes():-1;
  const b=busy.map(x=>[mn(x.hora),mn(x.hora)+x.dur_min]),r=[];
  for(let t=CFG.ABRE*60;t+s.dur_min<=CFG.CIERRA*60;t+=CFG.PASO)
    if(t>nm&&!b.some(([a,e])=>t<e&&t+s.dur_min>a))r.push(tm(t));
  return r}
async function book(){
  if(S.hp||Date.now()-(S.t||0)<4000)return;S.t=Date.now();
  const nm=S.name.trim(),ph=(p=>p.length==10&&p[0]=='3'?'57'+p:p)(S.phone.replace(/\D/g,''));
  if(!S.time||nm.length<2||ph.length<8){S.t=0;msg=S.off?((pros.find(x=>x.id==S.pro)?.nombre||'El profesional')+' está de descanso este día. Elige otra fecha u otro profesional.'):'Elige un horario y completa tu nombre y teléfono.';render();return}
  const s=svcs.find(x=>x.id==S.svc);
  try{
    await api('citas',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({fecha:S.date,hora:S.time,profesional_id:S.pro,servicio_id:S.svc,cliente:nm,telefono:ph})});
    done={...S,svc:s.nombre,pro:pros.find(p=>p.id==S.pro)?.nombre};msg='';
  }catch(e){
    msg=choque(e)?'Ese horario acaba de ocuparse. Elige otro.':'No pudimos guardar tu reserva. Intenta de nuevo.'+(location.search.includes('debug')?' ['+(e.status||'sin conexión')+(e.detail?': '+e.detail:'')+']':'');
    S.time='';await loadBusy()}
  render()}

function render(){
  if(TOKEN)return renderManage();
  const a=$('#app'),logo=`<img class="logo" src="${LOGO}" alt="S&H Centro de Belleza y Barbería">`;
  if(done){
    const t=encodeURIComponent(`Hola, soy ${done.name}. Reservé ${done.svc} el ${done.date} a las ${done.time}. ¿Me confirman?`);
    a.innerHTML=`<div class="hd">${logo}</div><div class="st ok"><div class="chk">✓</div><h2>¡Solicitud enviada!</h2><p><b>${esc(done.svc)}</b><br>con ${esc(done.pro)}<br>${done.date} · ${done.time}</p><p class="mu">Tu cita queda pendiente hasta que ${esc(CFG.NOMBRE)} la confirme.</p>`+(CFG.WA?`<a class="go" target="_blank" rel="noopener" href="https://wa.me/${CFG.WA}?text=${t}">Confirmar por WhatsApp</a>`:'')+`</div>`;return}
  if(!svcs.length||!pros.length){a.innerHTML=`<div class="hd">${logo}</div><p class="msg">${esc(msg||'Aún no hay servicios disponibles.')}</p>`;return}
  const sel=(k,o)=>`<select data-k="${k}">${o.map(([v,l])=>`<option value="${v}"${v==S[k]?' selected':''}>${esc(l)}</option>`).join('')}</select>`;
  const sl=slots(),sv=svcs.find(x=>x.id==S.svc),pr=pros.find(x=>x.id==S.pro);
  a.innerHTML=`<div class="hd">${logo}</div><div class="tag">Tu estilo, nuestra pasión</div>
  <section class="st"><h3><i>1</i>Elige tu servicio</h3>${sel('svc',svcs.map(x=>[x.id,`${x.nombre} · ${x.dur_min} min`]))}</section>
  <section class="st"><h3><i>2</i>Elige quién te atiende</h3>${sel('pro',prosFor().map(x=>[x.id,x.nombre]))}</section>
  <section class="st"><h3><i>3</i>Fecha y hora</h3><input type="date" data-k="date" min="${today}" max="${maxd}" value="${S.date}"><div class="slots">${sl.map(t=>`<button data-t="${t}" class="${S.time==t?'on':''}">${t}</button>`).join('')||`<span class="mu" style="grid-column:1/-1">${S.off?esc((pr&&pr.nombre)||'El profesional')+' está de descanso este día. Prueba otra fecha u otro profesional.':'Sin horarios este día, prueba otra fecha.'}</span>`}</div></section>
  <section class="st"><h3><i>4</i>Tus datos</h3><input data-f="name" placeholder="Tu nombre" autocomplete="name" value="${esc(S.name)}"><input data-f="phone" type="tel" placeholder="Tu celular (ej. 3001234567)" autocomplete="tel" value="${esc(S.phone)}"><input class="hp" data-f="hp" tabindex="-1" autocomplete="off" aria-hidden="true"></section>
  ${S.time&&sv&&pr?`<div class="sum">${esc(sv.nombre)} · ${esc(pr.nombre)} · ${S.date} · ${S.time}</div>`:''}
  ${msg?`<div class="msg">${esc(msg)}</div>`:''}
  <button class="go" data-book="1">Reservar cita</button>
  ${CFG.WA?`<p class="note">¿Quieres un tinte? Cada técnica es distinta, <a href="https://wa.me/${CFG.WA}?text=${encodeURIComponent('Hola, quiero consultar por un tinte')}" target="_blank" rel="noopener">escríbenos por WhatsApp</a> y te asesoramos.</p>`:''}
  <p class="foot">S&amp;H · CENTRO DE BELLEZA Y BARBERÍA</p>`}
const choque=e=>e.status==409||/sin_choques|exclusion|conflicting/i.test(e.detail||'');
const TOKEN=new URLSearchParams(location.search).get('t');
let M=null,Mm='',Mmsg='',Md=today,Mt='',Mb=[],Moff=false;
const rpc=(n,b)=>api('rpc/'+n,{method:'POST',body:JSON.stringify(b)});
async function loadManage(){try{const r=await rpc('mi_cita',{p_token:TOKEN});M=r&&r[0]||null;if(M)Md=M.fecha>today?M.fecha:today}catch(e){M=null}render()}
async function loadMb(){Mb=[];Moff=false;try{Mb=await rpc('ocupados',{p_prof:M.profesional_id,p_fecha:Md})}catch(e){}try{Moff=(await rpc('esta_de_descanso',{p_prof:M.profesional_id,p_fecha:Md}))===true}catch(e){}}
function mslots(){const n=new Date(),nm=Md==today?n.getHours()*60+n.getMinutes():-1,b=Mb.map(x=>[mn(x.hora),mn(x.hora)+x.dur_min]),r=[];for(let t=CFG.ABRE*60;t+M.dur_min<=CFG.CIERRA*60;t+=CFG.PASO)if(t>nm&&!b.some(([a,e])=>t<e&&t+M.dur_min>a))r.push(tm(t));return r}
async function mact(a){
  if(a=='back'){Mm='';Mmsg='';return render()}
  if(a=='cx'){Mm='cx';return render()}
  if(a=='re'){Mm='re';Mt='';await loadMb();return render()}
  try{
    if(a=='ok')await rpc('confirmar_cita',{p_token:TOKEN});
    else if(a=='yes')await rpc('cancelar_cita',{p_token:TOKEN});
    else if(a=='save'){if(!Mt){Mmsg='Elige un nuevo horario.';return render()}await rpc('reagendar_cita',{p_token:TOKEN,p_fecha:Md,p_hora:Mt})}
    Mm='';Mmsg='';await loadManage()
  }catch(e){Mmsg=choque(e)?'Ese horario ya no está disponible. Elige otro.':(e.status==400&&e.detail)||'No se pudo completar. Intenta de nuevo.';if(Mm=='re'){Mt='';await loadMb()}render()}
}
function renderManage(){
  const a=$('#app'),logo=`<img class="logo" src="${LOGO}" alt="S&H Centro de Belleza y Barbería">`;
  if(!M){a.innerHTML=`<div class="hd">${logo}</div><p class="msg">No encontramos esta cita. Escríbenos por WhatsApp.</p>`;return}
  const det=`<p><b>${esc(M.servicio)}</b><br>con ${esc(M.profesional)}<br>${M.fecha} · ${M.hora.slice(0,5)}</p>`;
  const lbl={pendiente:'Pendiente de confirmar',confirmada:'Confirmada ✓',cancelada:'Cancelada',atendida:'Atendida'}[M.estado]||M.estado;
  let body;
  if(M.estado=='cancelada'||M.estado=='atendida')body=`<a class="go" href="${location.pathname}">Reservar una nueva cita</a>`;
  else if(Mm=='cx')body=`<p class="mu">¿Seguro que quieres cancelar esta cita?</p><button class="go" data-a="yes">Sí, cancelar</button><button class="alt" data-a="back">Volver</button>`;
  else if(Mm=='re'){const sl=mslots();body=`<input type="date" data-mk="1" min="${today}" max="${maxd}" value="${Md}"><div class="slots">${sl.map(t=>`<button data-mt="${t}" class="${Mt==t?'on':''}">${t}</button>`).join('')||`<span class="mu" style="grid-column:1/-1">${Moff?esc(M.profesional)+' está de descanso este día. Prueba otra fecha.':'Sin horarios este día.'}</span>`}</div><button class="go" data-a="save">Confirmar nuevo horario</button><button class="alt" data-a="back">Volver</button>`}
  else body=(M.estado=='pendiente'?`<button class="go" data-a="ok">Confirmar mi cita</button>`:'')+`<button class="alt" data-a="re">Reagendar</button><button class="alt" data-a="cx">Cancelar cita</button>`;
  a.innerHTML=`<div class="hd">${logo}</div><section class="st ok"><div class="mu">${lbl}</div>${det}${Mmsg?`<div class="msg">${esc(Mmsg)}</div>`:''}${body}</section><p class="foot">S&amp;H · CENTRO DE BELLEZA Y BARBERÍA</p>`}
document.addEventListener('change',async e=>{if(e.target.dataset.mk){Md=e.target.value;Mt='';await loadMb();render()}});
document.addEventListener('change',async e=>{const k=e.target.dataset.k;if(!k)return;S[k]=e.target.value;S.time='';msg='';if(k=='svc')fixPro();await loadBusy();render()});
document.addEventListener('input',e=>{const f=e.target.dataset.f;if(f)S[f]=e.target.value});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.t){S.time=b.dataset.t;msg='';render()}else if(b.dataset.book)book();else if(b.dataset.mt){Mt=b.dataset.mt;render()}else if(b.dataset.a)mact(b.dataset.a)});
load();
</script></body></html>
